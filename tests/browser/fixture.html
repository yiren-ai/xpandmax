<!doctype html>
<meta charset="utf-8">
<title>XpandMax isolated extension test</title>
<style>
body { margin:0; font:15px system-ui; background:white; color:#0f1419; }
main { max-width:600px; margin:auto; padding:20px; }
article { padding:20px 0; border-bottom:1px solid #eff3f4; }
[data-testid="User-Name"] { display:flex; align-items:center; min-width:0; }
[data-testid="User-Name"] > div { display:flex; align-items:center; min-width:0; }
a { color:inherit; text-decoration:none; }
time { color:#536471; margin-left:6px; }
[role="link"] { border:1px solid #cfd9de; border-radius:12px; padding:16px; margin-top:16px; }
button { cursor:pointer; }
</style>
<main data-testid="primaryColumn">
<h1>扩展自动验收 · 合成账号</h1>
<article data-testid="tweet">
<div data-testid="User-Name"><div><a href="/fixture_author"><span>测试作者</span></a></div><div><span>@fixture_author</span><a href="/fixture_author/status/101"><time>1 小时</time></a></div></div>
<p data-testid="tweetText">这段 DOM 文本不应进入 Markdown。</p>
<div role="link"><div data-testid="User-Name"><div>引用作者</div><div><span>@fixture_quote</span><div><time id="quote-time">2 小时</time></div></div></div><p>引用卡片不使用原帖的数据。</p></div>
<div role="group"><button data-testid="reply">回复</button><button data-testid="bookmark"><div>书签</div></button><button aria-haspopup="menu" aria-label="分享帖子">分享</button></div>
</article>
<article data-testid="tweet"><div data-testid="User-Name"><a href="/fixture_ad">广告样本</a><a href="/fixture_ad/status/103"><time>1 小时</time></a></div><p>广告不显示流速徽章。</p></article>
<button id="reuse">复用原帖节点</button>
<button id="restore">恢复原帖节点</button>
<button id="refresh">重新接收数据</button>
</main>
<script>
const times = new URLSearchParams(location.search);
document.querySelector('#quote-time').dateTime = times.get('quoteTime');
document.querySelector('#reuse').onclick = () => document.querySelector('a[href*="/status/101"]').href = '/fixture_author/status/999';
document.querySelector('#restore').onclick = () => document.querySelector('a[href*="/status/999"]').href = '/fixture_author/status/101';
document.querySelector('[aria-label="分享帖子"]').onclick = () => {
  document.querySelector('[role="menu"]')?.remove();
  const menu = document.createElement('div');
  menu.setAttribute('role', 'menu');
  menu.innerHTML = '<div><div role="menuitem" data-testid="copyLink"><svg viewBox="0 0 24 24"><path d="M1 1"></path></svg><span>复制链接</span></div></div>';
  document.body.append(menu);
};
function receive() { return fetch('/i/api/graphql/fixture/HomeTimeline').then(r=>r.json()); }
document.querySelector('#refresh').onclick = receive;
receive();
</script>
